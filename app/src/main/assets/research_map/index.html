<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #061012; touch-action: none; }
  canvas { display: block; }
</style>
</head>
<body>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
/*
 * The research map: ideas, verses and hadith as glowing nodes in 3D, joined by thick links
 * coloured by relation, with pulses running from each idea to what it links to.
 *
 * Android -> page: setGraph(json), focusNode(id), clearFocus(), resetView(), setFilter(json)
 * page -> Android: Android.ready(), Android.select(id), Android.deselect()
 *
 * graph: { nodes: [{id, kind: "idea"|"ayah"|"hadith"|"note", label}],
 *          links: [{source, target, relation: "explains"|"supports"|"related"|"contrasts"}] }
 */
const KIND_COLOR = { idea: 0x26c6da, ayah: 0xffc857, hadith: 0xb388ff, note: 0xff8a65 };
const KIND_CSS = { idea: '#26c6da', ayah: '#ffc857', hadith: '#b388ff', note: '#ff8a65' };
const KIND_SIZE = { idea: 8, ayah: 5, hadith: 5, note: 5 };
const RELATION_COLOR = { explains: 0x4dd0e1, supports: 0x69f0ae, related: 0x8c9eff, contrasts: 0xff5252 };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x061012);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x061012, 0.0007);
const camera = new THREE.PerspectiveCamera(55, 1, 1, 4000);
camera.position.set(0, 0, 300);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.PointLight(0xffffff, 0.9);
light.position.set(120, 160, 200);
scene.add(light);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.enablePan = false;
controls.minDistance = 30;
controls.maxDistance = 900;
// the camera follows the layout until the reader takes over
let touched = false;
controls.addEventListener('start', () => { controls.autoRotate = false; touched = true; fly = null; });

(function stars() {
  const g = new THREE.BufferGeometry();
  const p = [];
  for (let i = 0; i < 800; i++) {
    const r = 900 + Math.random() * 600, t = Math.random() * Math.PI * 2, u = Math.acos(2 * Math.random() - 1);
    p.push(r * Math.sin(u) * Math.cos(t), r * Math.sin(u) * Math.sin(t), r * Math.cos(u));
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x5f8b8f, size: 2.5, fog: false })));
})();

function radialTexture(stops) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  for (const [at, color] of stops) g.addColorStop(at, color);
  x.fillStyle = g;
  x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
const GLOW = radialTexture([[0, 'rgba(255,255,255,0.9)'], [0.25, 'rgba(255,255,255,0.35)'], [1, 'rgba(255,255,255,0)']]);

function labelSprite(text, kind, size) {
  const font = 'bold 46px sans-serif';
  const c = document.createElement('canvas');
  const x = c.getContext('2d');
  x.font = font;
  const w = Math.ceil(x.measureText(text).width) + 48, h = 76, r = 22;
  c.width = w; c.height = h;
  x.font = font;
  x.beginPath();
  x.moveTo(r, 2); x.lineTo(w - r, 2); x.quadraticCurveTo(w - 2, 2, w - 2, r); x.lineTo(w - 2, h - r);
  x.quadraticCurveTo(w - 2, h - 2, w - r, h - 2); x.lineTo(r, h - 2); x.quadraticCurveTo(2, h - 2, 2, h - r);
  x.lineTo(2, r); x.quadraticCurveTo(2, 2, r, 2);
  x.fillStyle = 'rgba(6,16,18,0.78)';
  x.fill();
  x.lineWidth = 4;
  x.strokeStyle = KIND_CSS[kind] || '#ffffff';
  x.stroke();
  x.fillStyle = '#ffffff';
  x.textBaseline = 'middle';
  x.textAlign = 'center';
  x.fillText(text, w / 2, h / 2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  const height = size * 1.6;
  s.scale.set(height * w / h, height, 1);
  s.renderOrder = 10;
  return s;
}

const CYLINDER = new THREE.CylinderGeometry(1, 1, 1, 10, 1, true);
const UP = new THREE.Vector3(0, 1, 0);

let nodes = [], links = [], byId = {}, settle = 0, born = 0;
let focused = null, fly = null, filter = { ayah: true, hadith: true, note: true };

function clear() {
  for (const n of nodes) scene.remove(n.group);
  for (const l of links) { scene.remove(l.tube); scene.remove(l.pulse); }
  nodes = []; links = []; byId = {}; focused = null;
}

window.setGraph = function (json) {
  clear();
  const g = typeof json === 'string' ? JSON.parse(json) : json;
  const degree = {};
  for (const l of g.links) { degree[l.source] = (degree[l.source] || 0) + 1; degree[l.target] = (degree[l.target] || 0) + 1; }
  const spread = 40 + Math.sqrt(g.nodes.length) * 22;
  g.nodes.forEach((d, i) => {
    // well-linked nodes are bigger
    const size = (KIND_SIZE[d.kind] || 5) + Math.sqrt(degree[d.id] || 0) * 1.4;
    const color = KIND_COLOR[d.kind] || 0xffffff;
    const group = new THREE.Group();
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(size, 28, 18),
      new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6, roughness: 0.3, metalness: 0.1, transparent: true })
    );
    group.add(sphere);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    halo.scale.set(size * 5, size * 5, 1);
    group.add(halo);
    const label = labelSprite(d.label, d.kind, d.kind === 'idea' ? 9 : 7);
    label.position.set(0, size + (d.kind === 'idea' ? 9 : 7.5), 0);
    group.add(label);
    // a bigger, invisible sphere so small nodes are easy to tap
    const pick = new THREE.Mesh(new THREE.SphereGeometry(size * 2.2, 8, 6), new THREE.MeshBasicMaterial({ visible: false }));
    group.add(pick);
    group.position.set((Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread, (Math.random() - 0.5) * spread);
    group.scale.setScalar(0.001);
    scene.add(group);
    const node = { d, group, sphere, halo, label, pick, v: new THREE.Vector3(), size, delay: i * 4, links: [] };
    pick.userData.node = node;
    nodes.push(node);
    byId[d.id] = node;
  });
  for (const l of g.links) {
    const a = byId[l.source], b = byId[l.target];
    if (!a || !b) continue;
    const color = RELATION_COLOR[l.relation] || 0x8c9eff;
    const tube = new THREE.Mesh(CYLINDER, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, depthWrite: false }));
    scene.add(tube);
    const pulse = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(pulse);
    const link = { a, b, tube, pulse, phase: Math.random(), width: 0.9 };
    a.links.push(link); b.links.push(link);
    links.push(link);
  }
  settle = 420;
  born = 0;
  touched = false;
  controls.autoRotate = true;
  controls.target.set(0, 0, 0);
  applyLook();
};

// a light force layout: everything repels, links pull together, all drift to the centre
const tmp = new THREE.Vector3();
let radius = 50;
function step() {
  if (settle <= 0) return;
  settle--;
  const k = 0.02 + 0.98 * (settle / 420);
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      tmp.subVectors(a.group.position, b.group.position);
      const d2 = Math.max(tmp.lengthSq(), 100);
      tmp.multiplyScalar(140 / d2 * k);
      a.v.add(tmp); b.v.sub(tmp);
    }
  }
  for (const l of links) {
    tmp.subVectors(l.b.group.position, l.a.group.position);
    const d = tmp.length() || 1;
    tmp.multiplyScalar((d - 48) * 0.02 * k / d);
    l.a.v.add(tmp); l.b.v.sub(tmp);
  }
  const centre = new THREE.Vector3();
  for (const n of nodes) centre.add(n.group.position);
  if (nodes.length) centre.divideScalar(nodes.length);
  radius = 0;
  for (const n of nodes) {
    n.v.addScaledVector(n.group.position, -0.025 * k);
    n.v.multiplyScalar(0.82);
    if (n.v.length() > 4) n.v.setLength(4);
    n.group.position.add(n.v).sub(centre);
    radius = Math.max(radius, n.group.position.length() + n.size * 3);
  }
  if (!touched) {
    camera.position.setLength(camera.position.length() + (fitDistance() - camera.position.length()) * 0.08);
  }
}

function fitDistance() {
  const fit = radius / Math.sin(camera.fov * Math.PI / 360) * (camera.aspect < 1 ? 1 / camera.aspect : 1) * 0.72 + 20;
  return Math.max(controls.minDistance, Math.min(controls.maxDistance, fit));
}

function shown(n) { return n.d.kind === 'idea' || filter[n.d.kind] !== false; }

// dims everything but the focused node and its neighbours, and hides filtered kinds
function applyLook() {
  const near = new Set();
  if (focused) {
    near.add(focused);
    for (const l of focused.links) { near.add(l.a); near.add(l.b); }
  }
  for (const n of nodes) {
    n.group.visible = shown(n);
    const lit = !focused || near.has(n);
    n.sphere.material.opacity = lit ? 1 : 0.18;
    n.halo.material.opacity = lit ? 1 : 0.12;
    n.label.material.opacity = lit ? 1 : 0.15;
  }
  for (const l of links) {
    l.tube.visible = l.pulse.visible = shown(l.a) && shown(l.b);
    const mine = focused && (l.a === focused || l.b === focused);
    l.tube.material.opacity = !focused ? 0.7 : mine ? 0.95 : 0.06;
    l.pulse.material.opacity = !focused || mine ? 1 : 0;
    l.width = mine ? 1.8 : 0.9;
  }
}

window.focusNode = function (id) {
  const n = byId[id];
  if (!n) return;
  focused = n;
  controls.autoRotate = false;
  touched = true;
  // close enough to see the node and everything it links to
  let reach = n.size * 4;
  for (const l of n.links) reach = Math.max(reach, l.a.group.position.distanceTo(l.b.group.position) + 12);
  fly = { target: n.group.position, dist: Math.max(90, reach * 2.4) };
  shiftUp(true);
  applyLook();
};

// while a node is focused the card covers the bottom of the screen, so the scene moves up
let shift = 0, shiftGoal = 0;
function shiftUp(on) { shiftGoal = on ? 0.2 : 0; }

window.clearFocus = function () {
  focused = null;
  shiftUp(false);
  applyLook();
};

window.resetView = function () {
  focused = null;
  shiftUp(false);
  applyLook();
  fly = { target: new THREE.Vector3(), dist: fitDistance(), then: () => { controls.autoRotate = true; } };
};

window.setFilter = function (json) {
  filter = typeof json === 'string' ? JSON.parse(json) : json;
  if (focused && !shown(focused)) { focused = null; shiftUp(false); if (window.Android) Android.deselect(); }
  applyLook();
};

// a tap (not a drag) on a node selects it; a tap on empty space lets go
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, t: Date.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt) return;
  const moved = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y);
  const quick = Date.now() - downAt.t < 400;
  downAt = null;
  if (moved > 10 || !quick) return;
  pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects(nodes.filter(shown).map(n => n.pick))[0];
  if (hit) {
    const id = hit.object.userData.node.d.id;
    focusNode(id);
    if (window.Android) Android.select(id);
  } else if (focused) {
    clearFocus();
    if (window.Android) Android.deselect();
  }
});

// the page can run before the view is laid out (0x0, seen on fast phones), so the size is
// checked every frame and nothing moves or draws until there is one
let W = 0, H = 0;
function fitSize() {
  const w = window.innerWidth, h = window.innerHeight;
  if (w !== W || h !== H) {
    W = w; H = h;
    if (w > 0 && h > 0) {
      camera.aspect = w / h;
      if (shift) camera.setViewOffset(w, h, 0, h * shift, w, h); else camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
  }
  return W > 0 && H > 0;
}

const a = new THREE.Vector3(), b = new THREE.Vector3(), dir = new THREE.Vector3(), off = new THREE.Vector3();
let t = 0;
(function loop() {
  requestAnimationFrame(loop);
  if (!fitSize()) return;
  step();
  t += 0.016;
  born++;
  for (const n of nodes) {
    // nodes pop in one after another, with a little overshoot
    const grow = Math.min(1, Math.max(0, (born - n.delay) / 25));
    const ease = 1 + 2.7 * Math.pow(grow - 1, 3) + 1.7 * Math.pow(grow - 1, 2);
    const breathe = n === focused ? 1.1 + Math.sin(t * 5) * 0.06 : 1;
    n.group.scale.setScalar(Math.max(0.001, ease * breathe));
    n.halo.scale.setScalar(n.size * (n === focused ? 8 : n.d.kind === 'idea' ? 5 + Math.sin(t * 2 + n.size) * 0.5 : 5));
  }
  for (const l of links) {
    a.copy(l.a.group.position); b.copy(l.b.group.position);
    dir.subVectors(b, a);
    const len = dir.length() || 0.001;
    l.tube.position.copy(a).addScaledVector(dir, 0.5);
    l.tube.quaternion.setFromUnitVectors(UP, dir.normalize());
    const w = l.width * Math.min(l.a.group.scale.x, l.b.group.scale.x, 1);
    l.tube.scale.set(w, len, w);
    // a pulse runs from the idea to what it links to
    const p = (t * 0.35 + l.phase) % 1;
    l.pulse.position.copy(a).lerp(b, p);
    l.pulse.scale.setScalar(Math.max(0.001, (l.width > 1 ? 9 : 6) * Math.sin(p * Math.PI)));
  }
  if (fly) {
    off.subVectors(camera.position, controls.target);
    controls.target.lerp(fly.target, 0.1);
    off.setLength(off.length() + (fly.dist - off.length()) * 0.1);
    camera.position.copy(controls.target).add(off);
    if (controls.target.distanceTo(fly.target) < 0.5 && Math.abs(off.length() - fly.dist) < 1) {
      if (fly.then) { fly.then(); touched = false; }
      fly = null;
    }
  }
  if (Math.abs(shift - shiftGoal) > 0.001) {
    shift += (shiftGoal - shift) * 0.1;
    const w = window.innerWidth, h = window.innerHeight;
    camera.setViewOffset(w, h, 0, h * shift, w, h);
  }
  controls.update();
  if (!isFinite(camera.position.lengthSq())) { camera.position.set(0, 0, 300); controls.target.set(0, 0, 0); }
  renderer.render(scene, camera);
})();

if (window.Android) Android.ready();
</script>
</body>
</html>
